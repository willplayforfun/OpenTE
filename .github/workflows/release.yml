name: Release

# Builds redistributable artifacts for Windows (Linux/macOS disabled for
# now) and attaches them to a GitHub release. Triggered by pushing a tag
# like `v0.1.0`, or manually via workflow_dispatch for test builds.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-game:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-x64
            build-preset: windows-x64-release
            artifact-name: opente-game-windows-x64
            binary-dir: game/build/windows-x64/bin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'

      - name: Configure
        working-directory: game
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        working-directory: game
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: cmake --build --preset ${{ matrix.build-preset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.binary-dir }}

  build-extractor:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: opente-extract-windows-x64
            binary-name: opente-extract.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: tools
        run: pip install -r requirements.txt

      - name: Build standalone extractor
        working-directory: tools
        run: pyinstaller --onefile --name opente-extract run_extractor.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: tools/dist/${{ matrix.binary-name }}

  create-release:
    needs: [build-game, build-extractor]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package per-platform bundles
        run: |
          set -eu
          for platform_arch in windows-x64; do
            bundle="opente-${platform_arch}"
            mkdir -p "$bundle"
            cp -r "artifacts/opente-game-${platform_arch}/." "$bundle/"
            cp -r "artifacts/opente-extract-${platform_arch}/." "$bundle/"
            chmod +x "$bundle"/opente "$bundle"/opente-extract 2>/dev/null || true
            (cd "$bundle" && zip -r "../${bundle}.zip" .)
          done
          ls -la *.zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          generate_release_notes: true
